var ITER=250000;
function b64d(s){
  var bin=atob(s);
  var out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);
  return out;
}
function decode(pw,onOk,onErr){
  crypto.subtle.importKey("raw",new TextEncoder().encode(pw),{name:"PBKDF2"},false,["deriveKey"])
  .then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(SALT),iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  })
  .then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(NONCE)},key,b64d(CT));
  })
  .then(function(plain){ onOk(new TextDecoder().decode(plain)); })
  .catch(function(){ onErr(); });
}
var p=document.getElementById("pw");
var b=document.getElementById("go");
var e=document.getElementById("err");
function tryUnlock(){
  var v=p.value;
  if(!v){e.textContent="Enter a password";return;}
  b.disabled=true;b.textContent="Decrypting…";e.textContent="";
  decode(v,function(html){
    document.open();document.write(html);document.close();
  },function(){
    b.disabled=false;b.textContent="Unlock";
    e.textContent="❌ Wrong password";p.select();
  });
}
b.addEventListener("click",tryUnlock);
p.addEventListener("keydown",function(ev){ if(ev.key==="Enter")tryUnlock(); });
})();
